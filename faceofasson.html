<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anatomy Department - Face of ASSON</title>
  <link rel="stylesheet" href="style.css">
  <script>
    document.documentElement.setAttribute("data-theme", localStorage.getItem("site-theme") || "light");
  </script>
</head>
<body>
  <header class="site-header">
    <div class="header-container">
      <a href="index.html" class="logo-link">
        <img src="images/anatomy-logo.png" alt="Anatomy Department Logo" class="logo-image">
      </a>

      <div class="department-info">
        <h1>Department of Human Anatomy</h1>
        <p>Bingham University</p>
      </div>

      <nav class="main-nav">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="meetus.html" class="active">Meet Us</a></li>
          <li><a href="resources.html">Resources</a></li>
          <li><a href="News.html">News</a></li>
        </ul>
      </nav>

      <div class="theme-switcher">
        <button class="theme-btn" data-theme="light" aria-label="Light theme" title="Light"></button>
        <button class="theme-btn" data-theme="dark" aria-label="Dark theme" title="Dark"></button>
        <button class="theme-btn" data-theme="purple" aria-label="Purple theme" title="Purple"></button>
        <button class="theme-btn" data-theme="blue" aria-label="Blue theme" title="Blue"></button>
      </div>
    </div>
  </header>

  <main>
    <section class="welcome-section">
      <a class="back-link" href="meetus.html">&larr; Back to Meet Us</a>
      <h2>Face of ASSON</h2>
      <p></p>

       <div class="people-grid">
        <div class="people-card">
          <div class="people-photo">
            <img src="images/foafemale.jpeg" alt="Faith Kehinde Oluyemi">
          </div>
          <div class="people-info">
            <h3 class="people-name">Faith Kehinde Oluyemi</h3>
            <p class="people-role">Face of ASSON: Female</p>
          </div>
        </div>

         <div class="people-grid">
        <div class="people-card">
          <div class="people-photo">
            <img src="images/placeholder-person.svg" alt="Member Name">
          </div>
          <div class="people-info">
            <h3 class="people-name"></h3>
            <p class="people-role">Face of ASSON: Male</p>
          </div>
        </div>
    </section>
  </main>

 

  <script src="theme.js"></script>
</body>
</html>
